<body>
<div id="root"></div>
<script type="module">
const src = await (await fetch('src/App.jsx')).text();
const code = Babel.transform(src, { presets: ['react'] }).code
  .replace(/from 'react'/g, "from 'https://esm.sh/react@18.3.1'")
  .replace(/"assets\//g, '"public/assets/');
const mod = await import(URL.createObjectURL(new Blob([code], { type: 'text/javascript' })));
const React = await import('https://esm.sh/react@18.3.1');
const { createRoot } = await import('https://esm.sh/react-dom@18.3.1/client');
createRoot(document.getElementById('root')).render(React.createElement(mod.default, { headline: 'Builder → Backer', showAvailability: true }));
</script>
